# electron-builder configuration for the Sentinel desktop app.
# Version comes from the root package.json (1.0.0).
#
# Packaged contents:
#   electron/**            — main + preload (CommonJS, no build step needed)
#   desktop/backend/**     — self-contained API bundle (generated by npm run desktop:build)
#   frontend/dist/**       — production React build (generated by npm run desktop:build)
#   src/security-engine/** — deterministic CJS security engine, resolved at
#                            runtime by the API relative to its bundle
#                            (…/desktop/backend/../../src/security-engine)
#
# No secrets, no .env files, and no node_modules are packaged. Runtime
# configuration lives outside the app (see desktop/sentinel.config.example.json).

appId: io.sentinel.web3security
productName: Sentinel

directories:
  output: dist

files:
  - electron/**
  - desktop/backend/**
  - frontend/dist/**
  - src/security-engine/**
  - package.json

# The backend bundle and the security engine are spawned as a child process
# and required from real paths, so they must live outside app.asar.
asarUnpack:
  - desktop/backend/**
  - src/security-engine/**

# Dependencies are fully bundled into desktop/backend/backend.mjs; nothing
# needs native rebuilds.
npmRebuild: false

mac:
  category: public.app-category.finance
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: Sentinel-${version}-mac-${arch}.${ext}
  # Unsigned local build; set CSC_LINK / CSC_KEY_PASSWORD or a signing
  # identity to distribute outside of local testing.
  identity: null

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Sentinel-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Sentinel-${version}-win-${arch}-setup.${ext}
